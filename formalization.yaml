status:
  scope: >-
    Conditional formalization. Proved in a linear-algebra model of the cohomology of abelian varieties, by the
    paper's arguments except the departures listed under fidelity (notably Proposition 6.1.2 and Lemma 4.0.2,
    with the owner's approval): every result of Sections 1-6, 8 and 10 of the paper about cohomology classes, Clifford
    algebras, spin representations, Hodge structures and period domains, including Proposition 1.2.1, Proposition
    1.3.1, Corollary 1.3.2, Theorem 1.4.1(1), (3), (4) and the rank in (2), and the results the paper cites from
    Chevalley, Igusa (Lemmas 1-2, Section 2, the invariance of the quartic), Golyshev-Lunts-Orlov, Orlov,
    Huybrechts, Trautman, van Geemen (Def. 4.9) and Markman (2023). Theorem 1.5.1 and Corollary 1.6.1 are proved
    from named hypotheses: the paper's own Sections 7-9 (SecantSheafDeformation), PullbackClosed, SubalgebraClosed,
    LefschetzOneOne, VoisinLocus, VanGeemenModuli, SchoenDegeneration, MoonenZarhinSimple, RamonMariProducts and
    MoonenZarhinLowDim; three results of Section 10 assume IgusaProp3NormalForm or IgusaProp3OrbitSubfield. Not
    formalized: the sheaf theory and derived categories of Sections 5.1, 6.2 (Lemma 6.2.1), 7, 8.2-8.5, 9 and 11, and algebraic cycles
    themselves (algebraic classes are an abstract system with the hypotheses above). Eleven statements of the paper
    are formalized in corrected form (fidelity.divergences).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code 2.1.288 (VS Code extension, Claude Agent SDK)"
      tool_setup: >-
        The formalize-math-paper skill, version 2.1.0 (https://github.com/vltanh/formalize-math-paper, commit
        397f71c): one main session with 52 sub-agents (at most 10 at once) for the library survey,
        statements, statement review, proofs, cited results, refactors, proof review, fixes and the audit's
        verification; Lean v4.35.0-rc3, Mathlib, Tau Ceti.
      cost:
        wall_time: "14 h 25 min elapsed; 58.2 h of sub-agent work"
        spend_usd: "not tracked"
        hardware: "local machine (Linux, 62 GB RAM)"
      prompting_notes: >-
        The owner invoked the skill on the arXiv identifier and answered its questions: the scope (prove the
        paper's own mathematics in a cohomological model; keep Sections 7-9 and the cited results about algebraic
        cycles as named hypotheses, to be formalized later), the two authorized departures, every correction of a
        statement, and the hypotheses for Igusa's Proposition 3.
  spend_usd: "not tracked"
  notes: >-
    Produced with Claude Opus 5.5 (Anthropic), run as an agent in Claude Code, under the direction of the
    maintainer, who chose the scope and decided every change of a statement. Statements were reviewed against the TeX source by independent agents before any
    proof; proofs were compared with the paper's proofs by independent agents afterwards; the audit's findings and
    its literature survey were verified by separate agents. See CREDITS.md.

fidelity:
  divergences: >-
    Corrections of statements (REPORT.md, Section 6): Proposition 1.3.1, (1.3.1), (1.3.2) with m (x) m instead of
    m (x) m-dagger (E2); Lemma 2.2.1, second sentence, for odd n: nondegenerate instead of definite (E5); the image of
    Spin(V_K)_{l1,l2} in GL(W1) is the subgroup of square determinant, not all of GL(W1) (E6); Lemma 2.2.2:
    SL_{2n}(K) (misprint, E28); Remark 2.2.5: under the hypothesis that the whole circle lies in rho(Spin(V_R)_P)
    (E9); Remark 2.3.1: B0bar = -1/2 c1(P) (E10); Lemma 6.3.2: the sign (-1)^{d(d-1)/2} (E21); (8.1.2) with the
    hypothesis End_Q(X) = Q (E23); Section 8.1: the element extends iota composed with tau (E24); Section 8.1: the
    coefficient 4 in the expansion of beta (misprint, E28); Remark 10.1.2(1) for d nonzero (E26). Readings (Section
    6): abelian varieties up to isogeny as polarizable rational Hodge structures of weight one, algebraic classes as
    an abstract system with named hypotheses, the explicit X x X^; c1(P) = +sum e_i f_i (forced); the orientation of
    the complex structure of X x X^ as in the paper's footnote for the library's productStructure (E12), while the
    statements of record use the standard structure JX = -productStructure, the Weil-type period domain being the
    image of Omega_P under I -> -I; the integral Clifford algebra of the quadratic
    form (the author's correction, E4); statements for K-points where the paper reasons about algebraic groups;
    SU(V_Q, H) the special unitary group in Lemma 3.1.2. Departures from the paper's proofs (Section 7): Proposition
    6.1.2 and Lemma 6.2.5 proved algebraically instead of by reduction to abelian surfaces (reason 2, authorized);
    Lemma 4.0.2 by transitivity instead of a dimension count (reason 2, authorized); single steps in Lemma 2.2.1 (the
    pairing on P computed for both parities, reason 1), Lemma 2.2.6 (Hodge structures transported to C(V), reason
    3) and Lemma 2.2.7 (the type of the lines omega^j, reasons 3 and 1), Lemmas 2.2.4 and 2.2.7 (irreducibility via
    transvections and weights instead of density, reasons 1-2), Remark 2.2.3 (infinitesimal stabilizer, reason 2),
    Lemma 2.3.2(1) (a wrong step corrected, reason 1), Remark 2.4.3 (real lift via the spinor norm, reason 1),
    Section 2.4 (theta via ampleness, not the isogeny phi_L, reason 3), Lemma 3.1.2 (spinor norm, reason 1), Lemma
    4.0.1 (non-emptiness for general P, reason 1), Corollary 4.0.4 (density, reason 2), Section 6.2 (H^2 = H^2_P + Q Xi_P with H^2_P the span of the
    rho_g x - x and an invariant pairing instead of complete reducibility, reason 2), Lemma 6.2.3 (invariant
    pairing instead of complete reducibility, sl2 Lefschetz instead of hard Lefschetz, reason 2; the (1,1) type of
    l, reason 1), Lemma 8.1.1 (cosets instead of a Zariski closure, reason 2), Theorem 1.4.1(2) (the rank from
    ch(E), reason 3), Theorem 1.5.1 (d = 1, 2 via 4d and van Geemen's Th. 5.2(3) at the last step, reason 1), Lemma
    10.1.1 (Galois descent through w, reason 3; uniqueness via Igusa's Lemma 2, reason 1), Lemma 10.2.1 (order of
    two steps, reason 1; density via transvections, reason 2). Every other proof follows the paper's argument;
    docs/route_differences.tsv records every difference between the results a formal proof uses and those the
    paper's proof cites.

review:
  status: "agent-reviewed"
  reviewers:
    - "none"
  notes: >-
    No person has reviewed the proofs. Independent AI agents reviewed every statement against the TeX source
    before the proofs were written, compared every formal proof with the paper's proof afterwards, verified each
    finding of the audit against the TeX source (with an exact model of the paper's conventions), and verified the
    literature survey against its sources.

alignment:
  namespace: "WeilClasses.Challenge"
  statements:
    - source: "Theorem 1.4.1(3)"
      lean: "WeilClasses.Challenge.theorem1_4_1_3"
      module: "Challenge"
      status: "proved"
      note: "For every principally polarized abelian threefold (the paper: the Jacobian of a non-hyperelliptic genus-3 curve) and d >= 3; deformations are the points of the connected component of X x X^ in its Weil-type period domain."
    - source: "Theorem 1.4.1(4)"
      lean: "WeilClasses.Challenge.theorem1_4_1_4"
      module: "Challenge"
      status: "proved"
      note: "The K-translates of kappa_3(E) and h^3 span Q h^3 + HW, of dimension 3."
    - source: "Theorem 1.5.1"
      lean: "WeilClasses.Challenge.theorem1_5_1"
      module: "Challenge"
      status: "proved, conditional"
      note: "Under the named hypotheses PullbackClosed, SubalgebraClosed, LefschetzOneOne, VoisinLocus, VanGeemenModuli and SecantSheafDeformation (the paper's Sections 7-9)."
    - source: "Corollary 1.6.1"
      lean: "WeilClasses.Challenge.corollary1_6_1"
      module: "Challenge"
      status: "proved, conditional"
      note: "Under the hypotheses of Theorem 1.5.1 and SchoenDegeneration, MoonenZarhinSimple, RamonMariProducts, MoonenZarhinLowDim."
    - source: "Section 1.2 (the norm of K = Q(sqrt(-d)))"
      lean: "WeilClasses.Challenge.Kd_Nm"
      module: "Challenge"
      status: "proved"
      note: "Compared theorem: Nm(a + b sqrt(-d)) = a^2 + d b^2 for the definition of K and Nm."
    - source: "Section 2.4 (f^2 = -d)"
      lean: "WeilClasses.Challenge.fX_mul_self"
      module: "Challenge"
      status: "proved"
      note: "Compared theorem for the endomorphism f of H^1(X x X^)."
    - source: "Proposition 2.4.4, Corollary 3.2.3"
      lean: "WeilClasses.Challenge.JX_mem_weilDomain"
      module: "Challenge"
      status: "proved"
      note: "Compared theorem: X x X^ with (eta, h) is a polarized abelian 2n-fold of Weil type."
    - source: "Lemma 3.1.3"
      lean: "WeilClasses.Challenge.discIs_XXhat"
      module: "Challenge"
      status: "proved"
      note: "Compared theorem: the discriminant of X x X^ is (-1)^n."
    - source: "Theorem 1.4.1(2) (the rank 8d)"
      lean: "WeilClasses.Challenge.rank_chE"
      module: "Challenge"
      status: "proved"
      note: "Compared theorem: the degree-0 part of ch(E) is 8d."


version: "v0.4"

project:
  name: "Weil classes on abelian sixfolds and the Hodge conjecture for abelian fourfolds (Markman)"
  description: >-
    A conditional Lean 4 formalization of E. Markman, "Cycles on abelian 2n-folds of Weil type from secant
    sheaves on abelian n-folds" (arXiv:2502.03415v2). The paper proves that the Hodge-Weil classes of
    polarized abelian sixfolds of Weil type with discriminant -1 are algebraic (Theorem 1.5.1) and deduces the
    Hodge conjecture for abelian fourfolds (Corollary 1.6.1).


    Every result of the paper about cohomology classes, Clifford algebras, spin representations, Hodge
    structures and period domains is proved in a linear-algebra model of the cohomology of abelian varieties
    (abelian varieties up to isogeny as polarizable rational Hodge structures of weight one), by the paper's
    arguments except the departures listed under fidelity (notably Proposition 6.1.2 and Lemma 4.0.2, proved by
    other arguments with the owner's approval): rational secant lines to the spinor variety and the abelian 2n-folds of Weil type they give
    (Sections 2-4), the Spin(V)-equivariance of Orlov's equivalence (Section 6, Proposition 6.1.2), Theorem
    1.4.1(3) and (4) (the characteristic class of the secant-square sheaf stays of Hodge type on every Weil-type
    deformation of X x X^, and its K-translates with h^3 span Q h^3 + HW), Corollary 1.3.2, the cohomological
    results of Section 8, and Section 10. The results the paper cites from Chevalley, Igusa (Lemmas 1-2, Section
    2, the invariance of the quartic), Golyshev-Lunts-Orlov, Orlov, Huybrechts, Trautman, van Geemen (Def. 4.9)
    and Markman (2023) are proved in the case the paper uses.


    Theorem 1.5.1 and Corollary 1.6.1 are proved assuming, as named hypotheses in their statements, the paper's
    own sheaf-theoretic Sections 7-9 (in the form: the class kappa_3(E) is algebraic near X x X^ wherever kappa(E)
    is of Hodge type) and results from algebraic geometry not yet available in Lean: about algebraic cycles,
    pullbacks and products of algebraic classes, the Lefschetz (1,1) theorem, Voisin's algebraicity loci,
    Schoen's degeneration and a theorem of Ramon-Mari; about Hodge structures, van Geemen's moduli of Weil-type
    abelian varieties and two theorems of Moonen-Zarhin. Three results of Section 10 assume two parts of Igusa's
    Proposition 3. Eleven statements of the paper are false or misprinted as printed and are formalized in
    corrected form (the basis of Example 10.2.2 is also misprinted, with no effect on the value computed there);
    REPORT.md audits the paper.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

